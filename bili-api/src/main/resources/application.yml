server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bili_clone?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Yl12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 视频上限 500MB（ADR-17）；头像/背景图 2MB 由 Service 层显式校验（全局放宽后兜底）
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

bili:
  jwt:
    # HS256 签名密钥，>=32 字节（ADR-02）
    secret: bili-clone-dev-secret-key-32bytes-min!!
    expire-days: 7
  upload:
    # 上传根目录（ADR-04）；Windows 路径用正斜杠
    dir: D:/bili-upload

logging:
  level:
    com.bili: info
